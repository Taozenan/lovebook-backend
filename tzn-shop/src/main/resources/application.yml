spring:
  application:
    name: tzn-shop
  profiles:
    active: local
  config:
    import: optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://10.1.23.40:3306/fkf?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos123}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    secret: ${JWT_SECRET}

shop:
  upload-dir: ./uploads



spring:
  application:
    name: tzn-gateway
  config:
    import: optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos123}
    gateway:
      server:
        webmvc:
          routes:
            - id: tzn-auth
              uri: lb://tzn-auth
              predicates:
                - Path=/api/auth/**
            - id: tzn-system
              uri: lb://tzn-system
              predicates:
                - Path=/api/system/**
            - id: tzn-shop
              uri: lb://tzn-shop
              predicates:
                - Path=/api/shop/**

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info
